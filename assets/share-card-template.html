<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Karla', sans-serif;
  }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    background: linear-gradient(160deg, #16302a 0%, #1e4a3e 55%, #2c6a55 100%);
    display: grid;
    grid-template-columns: 430px 1fr;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 520px 380px at 100% -8%, rgba(211, 161, 60, 0.3), transparent 60%),
      repeating-linear-gradient(115deg, rgba(232, 196, 113, 0.05) 0 2px, transparent 2px 34px);
    pointer-events: none;
  }
  .photo-side {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px;
  }
  .photo-frame {
    width: 340px;
    height: 408px;
    border-radius: 8px 8px 90px 8px;
    background: linear-gradient(155deg, #e8c471, #c2673f);
    box-shadow: 0 24px 50px rgba(0,0,0,0.4);
    position: relative;
  }
  .photo-frame__inner {
    position: absolute;
    inset: 6px;
    border-radius: 6px 6px 84px 6px;
    overflow: hidden;
  }
  .photo-frame__inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .text-side {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 56px 64px 56px 24px;
    color: #f4efe0;
  }
  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #e8c471;
    margin-bottom: 22px;
  }
  .kicker::before {
    content: "";
    width: 32px;
    height: 2px;
    background: #e8c471;
    display: inline-block;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 58px;
    line-height: 1.12;
    margin: 0 0 22px;
    max-width: 12ch;
  }
  h1 em {
    font-style: normal;
    color: #e8c471;
  }
  p.lead {
    font-size: 21px;
    line-height: 1.45;
    color: rgba(244,239,224,0.9);
    max-width: 32ch;
    margin: 0 0 24px;
  }
  .progress-block {
    padding-top: 20px;
    border-top: 1px solid rgba(244,239,224,0.2);
    margin-bottom: 26px;
  }
  .progress-stats {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 12px;
  }
  .progress-stats .stat { display: flex; flex-direction: column; gap: 3px; }
  .progress-stats .stat.is-goal { text-align: right; align-items: flex-end; }
  .progress-stats .label {
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(244,239,224,0.6);
  }
  .progress-stats .value {
    font-family: 'Fraunces', serif;
    font-size: 32px;
    font-weight: 600;
    color: #f4efe0;
  }
  .progress-stats .value.accent { color: #e8c471; }
  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: rgba(244,239,224,0.18);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #d3a13c, #e8c471);
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    align-self: flex-start;
    background: #d3a13c;
    color: #16302a;
    font-weight: 700;
    font-size: 24px;
    padding: 18px 34px;
    border-radius: 10px;
  }
  .cta svg { width: 26px; height: 26px; stroke: #16302a; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .link-line {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 24px;
    font-size: 21px;
    font-weight: 600;
    color: #f4efe0;
  }
  .link-line svg { width: 21px; height: 21px; stroke: #e8c471; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="photo-side">
      <div class="photo-frame">
        <div class="photo-frame__inner">
          <img src="ESTEBAN_PHOTO_PATH" alt="">
        </div>
      </div>
    </div>
    <div class="text-side">
      <div class="kicker">Campaña solidaria</div>
      <h1>Fuerza <em>Cuilo</em></h1>
      <p class="lead">Apoyemos a Esteban "Cuilo" Ruiz en su batalla contra el cáncer.</p>
      <div class="progress-block">
        <div class="progress-stats">
          <div class="stat">
            <span class="label">Recaudado</span>
            <span class="value">RAISED_VALUE</span>
          </div>
          <div class="stat is-goal">
            <span class="label">Meta</span>
            <span class="value accent">GOAL_VALUE</span>
          </div>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:PROGRESS_PERCENT%"></div></div>
      </div>
      <div class="cta">
        <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-10-9.4C.4 7.6 2.4 4 6 4c2.1 0 3.6 1.1 4.5 2.4C11.4 5.1 12.9 4 15 4c3.6 0 5.6 3.6 4 7.1-2.5 4.8-10 9.4-10 9.4z"/></svg>
        Toca para ver y donar
      </div>
      <div class="link-line">
        <svg viewBox="0 0 24 24"><path d="M9.5 14.5 14.5 9.5"/><path d="M11 6.5 12.6 5a4 4 0 0 1 5.7 5.7L16.8 12"/><path d="M13 17.5 11.4 19a4 4 0 0 1-5.7-5.7L7.2 12"/></svg>
        quesadalil.github.io/Lil
      </div>
    </div>
  </div>
</body>
</html>
